<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="imagens/JP STORE.gif" type="image/x-icon">
  <title>Bootstrap</title>
  	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>
      
      .yu{
        height: 700px;
        background: linear-gradient(1800deg,blue, #DC3545);
      }
    </style>
</head>
<body>
<div id="carouselExampleFade" class="carousel slide carousel-fade bg-danger">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img width="50%"  src="imagens/wzn dune.webp" class="d-block " alt="...">
    </div>
    <div class="carousel-item">
      <img src="imagens/wzn dune2.webp" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="..." class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
<div class="yu"></div>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
